services:
  hapvida-check:
    build: .
    container_name: hapvida-check
    restart: unless-stopped
    # UID/GID do superadmin no host - sem isso, arquivos gravados no volume
    # do SharePoint (/opt/projeto_ra) saem root:root e o rclone bisync
    # (que roda como superadmin) pode nao conseguir mexer neles depois.
    user: "1001:1002"
    environment:
      GCP_PROJECT: ${GCP_PROJECT}
      # file (padrao desde a saida do GCP, 29/09/2026) | gcp: credenciais dos portais num JSON 600 fora do git (ver secrets_store.py)
      SECRETS_BACKEND: ${SECRETS_BACKEND:-file}
      SECRETS_FILE: /run/portais/portais.json
      PGHOST: ${PGHOST}
      PGPORT: ${PGPORT}
      PGDATABASE: ${PGDATABASE}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      TZ: ${TZ:-America/Sao_Paulo}
      MOTOR_EXCLUSAO_PATH: /motor
      EXCLUSAO_LOTES_DIR: /projeto_ra/movimentacoes/exclusao
      EXCLUSAO_PRIVADO_DIR: /dados_exclusao
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      # Ciclo de criticas (08/10/2026): motor do repo lifetools (so' leitura), dados/saidas com PII fora do
      # SharePoint, schema saneamento no banco de producao (aprovado pelo Andre em 08/10). O vigia so' chama
      # o ciclo com CICLO_NO_VIGIA=1 (ligar depois do menu validado).
      SANEAMENTO_PATH: /lifetools_service
      CICLO_DADOS: /dados_motor
      SAIDA_MOTOR: /dados_motor/_saidas
      SANEAMENTO_DB_NAME: ${SANEAMENTO_DB_NAME:-lifetools_dev}
      SANEAMENTO_PERMITE_PROD: ${SANEAMENTO_PERMITE_PROD:-0}
      CICLO_NO_VIGIA: ${CICLO_NO_VIGIA:-0}
    volumes:
      # Espelho local do SharePoint "Projeto_RA" (rclone bisync, ~10min) -
      # onde o processo de envio de documentos grava uma copia de cada
      # anexo, mesma convencao de nome do Cowork (#152, 31/08/2026).
      - /opt/projeto_ra/operadoras/hapvida/faturas:/sharepoint/faturas
      # Procedimento mensal (faturamento_mensal.py, 28/09/2026): handoff pro
      # Cowork quando falta arquivo do Legado + planilha de contratos ativos
      # do Legado (so' leitura - o script le Contrato/Empresa/Status, nunca
      # as colunas de usuario/senha).
      - /opt/projeto_ra/_handoff/entrada:/projeto_ra/_handoff/entrada
      - /opt/projeto_ra/operadoras/Access/Hapvida:/projeto_ra/operadoras/Access/Hapvida:ro
      - ./secrets:/run/portais:ro
      # Motor de Exclusao (03/10/2026): codigo do motor (repo lifetools, so' leitura), lotes na pasta padrao
      # de movimentacoes (sincroniza com o SharePoint) e as fotos de censo/pedidos (dado de TODO o contrato)
      # numa pasta privada 700 fora do SharePoint.
      - /opt/lifetools/motor_exclusao:/motor/motor_exclusao:ro
      - /opt/projeto_ra/operadoras/hapvida/movimentacoes:/projeto_ra/movimentacoes
      - /home/superadmin/motor_exclusao_dados/lotes:/dados_exclusao
      - /opt/lifetools/service:/lifetools_service:ro
      - /home/superadmin/motor_criticas_dados:/dados_motor
    networks:
      - n8n_default
      - lifetools_default

networks:
  n8n_default:
    external: true
  lifetools_default:
    external: true
